<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government School Management Portal</title>
<style>
:root{--navy:#142b4a;--blue:#2563eb;--sky:#eaf2ff;--bg:#f4f7fb;--text:#172338;--muted:#64748b;--line:#e5eaf2;--white:#fff;--green:#15966a;--red:#dc5656}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--navy);color:white;padding:22px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid #ffffff24}.brand-icon{width:40px;height:40px;border-radius:12px;background:#ffffff1b;display:grid;place-items:center;font-size:22px}.brand strong{display:block;font-size:14px}.brand small{color:#b9c9df}.nav-label{font-size:10px;letter-spacing:1.5px;color:#9db0ca;padding:5px 10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d7e3f3;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff1a;color:white}.nav .ico{width:19px;text-align:center}.sidebar-foot{margin-top:auto;color:#aebed2;font-size:11px;line-height:1.6;padding:10px}
.main{min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.crumb{font-size:13px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:12px}.pill{background:#edf5ff;color:#2456a4;padding:7px 11px;border-radius:20px;font-size:11px}.avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:700}
.content{padding:28px 30px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.page-head h1{font-size:24px;margin:0 0 6px}.page-head p{margin:0;color:var(--muted);font-size:13px}.btn{border:0;background:var(--blue);color:white;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600}.btn:hover{filter:brightness(.95)}.btn.secondary{background:white;border:1px solid var(--line);color:var(--text)}.btn.green{background:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #1e3a5f05}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--sky);display:grid;place-items:center;font-size:17px}.stat-num{font-size:27px;font-weight:750;margin:13px 0 4px}.stat-note{font-size:11px;color:var(--muted)}.grid-two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.card h3{margin:0 0 14px;font-size:14px}.bars{height:175px;display:flex;align-items:end;gap:13px;padding:12px 8px 0;border-bottom:1px solid var(--line)}.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.bar{width:70%;max-width:36px;background:linear-gradient(180deg,#60a5fa,#2563eb);border-radius:6px 6px 0 0;min-height:5px}.bar-wrap small{font-size:10px;color:var(--muted)}.notice{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:12px}.notice:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;margin-top:4px;flex:none}.notice small{display:block;color:var(--muted);margin-top:4px}.table-card{margin-top:17px}.table-tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.table-tools input,.table-tools select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:white;color:var(--text);font-size:12px}.table-tools input{min-width:220px;flex:1}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:600;background:#f8fafc;padding:12px 10px;white-space:nowrap}td{padding:12px 10px;border-top:1px solid var(--line)}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf8f1;color:#12805a;font-size:10px}.tag.warn{background:#fff5e5;color:#a56809}.tag.red{background:#fff0f0;color:#c34444}.empty{padding:30px;text-align:center;color:var(--muted)}.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.resource{border:1px solid var(--line);border-radius:11px;padding:15px;background:white}.resource h4{margin:8px 0;font-size:13px}.resource p{font-size:11px;color:var(--muted);line-height:1.5}.resource a{font-size:11px;color:var(--blue);text-decoration:none;font-weight:600}.resource a:hover{text-decoration:underline}.class-chips{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.class-chips button{border:1px solid var(--line);background:white;border-radius:18px;padding:7px 12px;font-size:11px}.class-chips button.active{background:var(--blue);color:white;border-color:var(--blue)}.chatbox{height:420px;display:flex;flex-direction:column}.chat-messages{flex:1;overflow:auto;padding:8px 0}.bubble{max-width:80%;padding:11px 13px;border-radius:12px;background:#f0f5ff;font-size:12px;line-height:1.5;margin:8px 0}.bubble.user{background:#2563eb;color:white;margin-left:auto}.chat-input{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:13px}.chat-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:11px;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:600}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.modal-box{background:white;border-radius:14px;padding:22px;width:min(540px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0}.close{border:0;background:#f1f5f9;border-radius:7px;padding:6px 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.footer-note{font-size:10px;color:var(--muted);margin-top:18px;line-height:1.5}
.mobile-menu{display:none;border:0;background:white;font-size:20px}.hidden{display:none!important}
@media(max-width:950px){.app{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid-two{grid-template-columns:1fr}.resource-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;z-index:8;top:0;bottom:0;left:-260px;width:250px;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:block}.topbar{padding:0 15px}.content{padding:20px 14px}.topbar .crumb{display:none}.stats{gap:9px}.stat-num{font-size:23px}.page-head{align-items:center}.page-head h1{font-size:20px}.resource-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table-card{overflow:auto}.table-card table{min-width:650px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-icon">🏫</div><div><strong id="schoolBrand">Government School</strong><small>Management Portal</small></div></div>
  <div><div class="nav-label">MAIN MENU</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="students"><span class="ico">🎓</span>Students</button>
    <button data-page="teachers"><span class="ico">👩‍🏫</span>Teachers & Staff</button>
    <button data-page="structure"><span class="ico">🏢</span>School Structure</button>
    <button data-page="attendance"><span class="ico">☑</span>Attendance</button>
    <button data-page="exams"><span class="ico">📝</span>Examinations & Results</button>
    <button data-page="timetable"><span class="ico">🗓</span>Timetable</button>
    <button data-page="resources"><span class="ico">📚</span>Books & Resources</button>
    <button data-page="notices"><span class="ico">📢</span>Notices & Events</button>
    <button data-page="library"><span class="ico">📖</span>Library</button>
    <button data-page="reports"><span class="ico">📊</span>Reports</button>
    <button data-page="assistant"><span class="ico">🤖</span>AI Assistant</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav></div>
  <div class="sidebar-foot">Independent school management tool.<br>Not an official Government of Delhi website.</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="menuBtn">☰</button><span class="crumb">School Portal / <b id="crumb">Dashboard</b></span></div><div class="top-actions"><span class="pill">Academic Session 2026–27</span><div class="avatar">A</div><span style="font-size:12px;font-weight:600">Administrator</span></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle">Add record</h3><button class="close" onclick="closeModal()">✕</button></div><form id="recordForm"><div class="form-grid" id="formFields"></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save record</button></div></form></div></div>
<script>
const KEY='schoolPortalDemoV1';
const seed={
 students:[
  {id:1,name:'Aarav Kumar',admission:'GS-26001',className:'Class 6',section:'A',roll:'01',status:'Active'},
  {id:2,name:'Ananya Sharma',admission:'GS-26002',className:'Class 7',section:'B',roll:'02',status:'Active'},
  {id:3,name:'Rohan Verma',admission:'GS-26003',className:'Class 8',section:'A',roll:'03',status:'Active'},
  {id:4,name:'Meera Singh',admission:'GS-26004',className:'Class 9',section:'A',roll:'04',status:'Active'},
  {id:5,name:'Kabir Ali',admission:'GS-26005',className:'Class 10',section:'C',roll:'05',status:'Active'}
 ],
 teachers:[
  {id:1,name:'Priya Sharma',employee:'EMP-001',subject:'Mathematics',designation:'TGT',status:'Active'},
  {id:2,name:'Amit Kumar',employee:'EMP-002',subject:'Science',designation:'TGT',status:'Active'},
  {id:3,name:'Neha Verma',employee:'EMP-003',subject:'English',designation:'PGT',status:'Active'}
 ],
 notices:[
  {id:1,title:'Welcome to the new academic session',date:'2026-04-01',category:'Announcement'},
  {id:2,title:'Parent-teacher meeting schedule',date:'2026-11-20',category:'Meeting'},
  {id:3,title:'Annual examination preparation',date:'2026-12-05',category:'Examination'}
 ],
 exams:[{id:1,name:'Half-Yearly Examination',className:'Class 8',date:'2026-11-25',subject:'All subjects'}],
 attendance:[],books:[]
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
let current='dashboard',selectedClass='Class 6';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setPage(page){current=page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=({dashboard:'Dashboard',students:'Student Management',teachers:'Teacher Management',structure:'School Structure',attendance:'Attendance',exams:'Examinations & Results',timetable:'Timetable',resources:'Books & Learning Resources',notices:'Notices & Events',library:'Library Management',reports:'Reports & Analytics',assistant:'AI School Assistant',settings:'Settings'})[page]||page;render();$('#sidebar').classList.remove('open')}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
function head(title,desc,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,num,icon,note){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-num">${num}</div><div class="stat-note">${note}</div></div>`}
function table(headers,rows){return `<div class="table-card card"><div style="overflow:auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records yet. Add a record to get started.</td></tr>`}</tbody></table></div></div>`}
function render(){
 const c=$('#content');
 if(current==='dashboard'){
 const bars=[['Jun',65],['Jul',82],['Aug',74],['Sep',91],['Oct',78],['Nov',86]];
 c.innerHTML=head('School Overview','Here is a snapshot of your school operations.',`<button class="btn" onclick="setPage('students')">＋ Add Student</button>`)+
 `<div class="stats">${stat('Total Students',db.students.length,'🎓','Demo and locally added records')}${stat('Total Teachers',db.teachers.length,'👩‍🏫','Teaching staff records')}${stat('Classes','12','🏫','Configurable school structure')}${stat('Notices',db.notices.length,'📢','Published notices')}</div>
 <div class="grid-two"><div class="card"><h3>Monthly attendance overview</h3><div class="bars">${bars.map(([m,v])=>`<div class="bar-wrap"><div class="bar" style="height:${v}%"></div><small>${m}</small></div>`).join('')}</div><div class="stat-note" style="margin-top:12px">Illustrative sample chart — connect real attendance records for live statistics.</div></div>
 <div class="card"><h3>Recent school notices</h3>${db.notices.slice(-4).reverse().map(n=>`<div class="notice"><span class="dot"></span><div>${esc(n.title)}<small>${esc(n.category)} · ${esc(n.date)}</small></div></div>`).join('')||'<div class="empty">No notices published.</div>'}</div></div>
 <div class="card" style="margin-top:16px"><h3>Quick actions</h3><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="openRecord('students')">＋ Add student</button><button class="btn secondary" onclick="openRecord('teachers')">＋ Add teacher</button><button class="btn secondary" onclick="setPage('attendance')">☑ Mark attendance</button><button class="btn secondary" onclick="openRecord('exams')">＋ Create examination</button><button class="btn secondary" onclick="openRecord('notices')">＋ Publish notice</button></div></div>`;
 }else if(current==='students'){
 const rows=db.students.map(s=>`<tr><td>${esc(s.admission)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.className)}</td><td>${esc(s.section)}</td><td>${esc(s.roll)}</td><td><span class="tag">${esc(s.status)}</span></td><td><button class="btn secondary" onclick="removeRecord('students',${s.id})">Remove</button></td></tr>`).join('');
 c.innerHTML=head('Student Management','Register, search and maintain student records.',`<button class="btn" onclick="openRecord('students')">＋ Add Student</button>`)+`<div class="card"><div class="table-tools"><input id="studentSearch" placeholder="Search name, admission number or class..." oninput="filterTable(this,'studentTable')"><button class="btn secondary" onclick="exportCSV('students')">Export CSV</button></div></div><div id="studentTable">${table(['Admission No.','Student Name','Class','Section','Roll No.','Status','Action'],rows)}</div>`;
 }else if(current==='teachers'){
 const rows=db.teachers.map(t=>`<tr><td>${esc(t.employee)}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.designation)}</td><td>${esc(t.subject)}</td><td><span class="tag">${esc(t.status)}</span></td><td><button class="btn secondary" onclick="removeRecord('teachers',${t.id})">Remove</button></td></tr>`).join('');
 c.innerHTML=head('Teachers & Staff','Maintain teaching staff and employee details.',`<button class="btn" onclick="openRecord('teachers')">＋ Add Teacher</button>`)+table(['Employee ID','Name','Designation','Subject','Status','Action'],rows);
 }else if(current==='structure'){
 c.innerHTML=head('School Structure','Configure academic sections, classes, sections and facilities.')+`<div class="grid-two"><div class="card"><h3>Academic hierarchy</h3>${['Primary Section · Classes 1–5','Middle Section · Classes 6–8','Secondary Section · Classes 9–10','Senior Secondary · Classes 11–12'].map(x=>`<div class="notice"><span class="dot"></span>${x}</div>`).join('')}</div><div class="card"><h3>School profile</h3><p class="stat-note">School name: ${esc(localStorage.schoolName||'Government School')}</p><p class="stat-note">Academic session: 2026–27</p><p class="stat-note">School ID / UDISE+: Add verified school details in Settings.</p><p class="footer-note">This is a configurable sample structure. Confirm actual classes, streams, shifts and sections with your school.</p><button class="btn secondary" onclick="setPage('settings')">Edit school profile</button></div></div>`;
 }else if(current==='attendance'){
 c.innerHTML=head('Attendance Management','Record daily class attendance. Demo entries are stored in this browser.',`<button class="btn" onclick="markAttendance()">＋ Mark Attendance</button>`)+`<div class="stats">${stat('Attendance entries',db.attendance.length,'☑','Saved on this device')}${stat('Students in demo',db.students.length,'🎓','Student records')}${stat('Present today',db.attendance.filter(a=>a.date===new Date().toISOString().slice(0,10)&&a.status==='Present').length,'✓','Based on saved entries')}${stat('Absent today',db.attendance.filter(a=>a.date===new Date().toISOString().slice(0,10)&&a.status==='Absent').length,'—','Based on saved entries')}</div>`+table(['Date','Student','Class','Status'],db.attendance.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.student)}</td><td>${esc(a.className)}</td><td><span class="tag ${a.status==='Absent'?'red':''}">${esc(a.status)}</span></td></tr>`).join(''));
 }else if(current==='exams'){
 c.innerHTML=head('Examinations & Results','Create examination schedules and maintain result records.',`<button class="btn" onclick="openRecord('exams')">＋ Create Examination</button>`)+table(['Examination','Class','Subject','Date'],db.exams.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.className)}</td><td>${esc(e.subject)}</td><td>${esc(e.date)}</td></tr>`).join(''))+`<p class="footer-note">Marks entry, grading and report-card generation require a verified grading scheme and a secure database in a production version.</p>`;
 }else if(current==='timetable'){
 c.innerHTML=head('Class Timetable','Sample weekly timetable layout. Configure actual periods and teacher allocations with your school.')+`<div class="card"><div class="class-chips">${['Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12'].map(x=>`<button class="${selectedClass===x?'active':''}" onclick="selectedClass='${x}';render()">${x}</button>`).join('')}</div><h3>${selectedClass} · Weekly timetable template</h3>${table(['Day','Period 1','Period 2','Period 3','Period 4','Period 5'],['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<tr><td>${d}</td><td>English</td><td>Mathematics</td><td>Science</td><td>Hindi</td><td>Social Science</td></tr>`).join(''))}<p class="footer-note">Template only. Add real teacher, room and period assignments before using operationally.</p></div>`;
 }else if(current==='resources'){
 const links=[['Delhi Education Department','Official portal','https://www.edudel.nic.in/'],['Academic Resources','Academic information','https://www.edudel.nic.in/edu/Academic.html'],['Class-wise Syllabus','Syllabus and curriculum','https://www.edudel.nic.in/edu/Syllabus.html'],['Examination Materials','Official examination resources','https://www.edudel.nic.in/edu/examinationmaterial.html'],['ICT Books','ICT learning resources','https://edudel.nic.in/edu/ict.html'],['Official E-content','Digital learning content','https://www.edudel.nic.in/mis/smc/other/frmEContent1.aspx']];
 c.innerHTML=head('Books & Learning Resources','Choose a class and open official Delhi Education Department resources.')+`<div class="class-chips">${['Nursery','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12'].map(x=>`<button class="${selectedClass===x?'active':''}" onclick="selectedClass='${x}';render()">${x}</button>`).join('')}</div><div class="resource-grid">${links.map((r,i)=>`<div class="resource"><div style="font-size:21px">${['🏛️','📘','📚','📝','💻','🎥'][i]}</div><h4>${r[0]}</h4><p>${r[1]} · Selected class: ${selectedClass}</p><a href="${r[2]}" target="_blank" rel="noopener">Open official resource ↗</a></div>`).join('')}</div><p class="footer-note">These are links to official portals, not guaranteed direct textbook PDF links. Check each resource for current class and subject availability.</p>`;
 }else if(current==='notices'){
 c.innerHTML=head('Notices & Events','Publish school announcements, circulars and meeting information.',`<button class="btn" onclick="openRecord('notices')">＋ Publish Notice</button>`)+table(['Title','Date','Category','Action'],db.notices.map(n=>`<tr><td><b>${esc(n.title)}</b></td><td>${esc(n.date)}</td><td>${esc(n.category)}</td><td><button class="btn secondary" onclick="removeRecord('notices',${n.id})">Remove</button></td></tr>`).join(''));
 }else if(current==='library'){
 c.innerHTML=head('Library Management','Maintain a simple catalogue of school library books.',`<button class="btn" onclick="openRecord('books')">＋ Add Book</button>`)+table(['Book Title','Author','Category','Copies'],db.books.map(b=>`<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.category)}</td><td>${esc(b.copies)}</td></tr>`).join(''));
 }else if(current==='reports'){
 c.innerHTML=head('Reports & Analytics','Download basic CSV reports from records saved in this browser.')+`<div class="resource-grid">${[['Student list','students'],['Teacher list','teachers'],['Attendance entries','attendance'],['Notices','notices']].map(x=>`<div class="resource"><h4>${x[0]}</h4><p>Export current ${x[0].toLowerCase()} records.</p><button class="btn secondary" onclick="exportCSV('${x[1]}')">Download CSV</button></div>`).join('')}</div>`;
 }else if(current==='assistant'){
 c.innerHTML=head('AI School Assistant','A sample help panel. Connect a secure AI backend to enable real AI answers.')+`<div class="card chatbox"><div class="chat-messages" id="messages"><div class="bubble">Hello! I am the School Assistant demo. I can point you to the school portal sections and official learning-resource links. A real AI service is not connected yet.</div></div><div class="chat-input"><input id="chatText" placeholder="Ask about books, attendance, exams or notices..." onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">Send</button></div></div><p class="footer-note">For a real AI chatbot, connect an AI provider through a secure server-side function. Never place an API key in this HTML file.</p>`;
 }else if(current==='settings'){
 c.innerHTML=head('Settings','Configure the school name shown in this portal.')+`<div class="card" style="max-width:600px"><div class="field"><label>School display name</label><input id="schoolNameInput" value="${esc(localStorage.schoolName||'Government School')}" placeholder="Enter school name"></div><div class="field" style="margin-top:13px"><label>Academic session</label><input value="2026–27" disabled></div><div style="margin-top:16px"><button class="btn" onclick="saveSettings()">Save settings</button></div><p class="footer-note">This demo stores settings in this browser only. It is not a secure multi-user system.</p></div><div class="card" style="max-width:600px;margin-top:14px"><h3>Demo data</h3><p class="stat-note">Reset this browser's demo records to the original sample data.</p><button class="btn secondary" onclick="resetDemo()">Reset demo data</button></div>`;
 }
}
function openRecord(type){
 const configs={
 students:{title:'Add student',fields:[['name','Student name'],['admission','Admission number'],['className','Class'],['section','Section'],['roll','Roll number'],['status','Status']]},
 teachers:{title:'Add teacher',fields:[['name','Teacher name'],['employee','Employee ID'],['designation','Designation'],['subject','Subject'],['status','Status']]},
 exams:{title:'Create examination',fields:[['name','Examination name'],['className','Class'],['subject','Subject'],['date','Examination date','date']]},
 notices:{title:'Publish notice',fields:[['title','Notice title'],['date','Publication date','date'],['category','Category']]},
 books:{title:'Add library book',fields:[['title','Book title'],['author','Author'],['category','Category'],['copies','Number of copies','number']]}
 };
 const cfg=configs[type];if(!cfg)return;$('#modalTitle').textContent=cfg.title;$('#recordForm').dataset.type=type;
 $('#formFields').innerHTML=cfg.fields.map(([key,label,inputType])=>`<div class="field"><label>${label}</label><input name="${key}" type="${inputType||'text'}" ${key==='status'?'value="Active"':''} required></div>`).join('');
 $('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open')}
$('#recordForm').addEventListener('submit',e=>{e.preventDefault();const type=e.target.dataset.type;const item=Object.fromEntries(new FormData(e.target).entries());item.id=Date.now();if(type==='students'&&!item.className.startsWith('Class')&&!item.className.toLowerCase().includes('nursery'))item.className='Class '+item.className;db[type].push(item);save();closeModal();render()});
function removeRecord(type,id){if(!confirm('Remove this demo record?'))return;db[type]=db[type].filter(x=>x.id!==id);save();render()}
function filterTable(input,id){const q=input.value.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function exportCSV(type){const rows=db[type]||[];if(!rows.length){alert('No records to export yet.');return}const cols=[...new Set(rows.flatMap(x=>Object.keys(x)))];const csv=[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=type+'.csv';a.click();URL.revokeObjectURL(a.href)}
function markAttendance(){if(!db.students.length){alert('Add students first.');return}const date=new Date().toISOString().slice(0,10);const student=prompt('Enter exact student name:\n'+db.students.map(s=>s.name).join('\n'));if(!student)return;const s=db.students.find(x=>x.name.toLowerCase()===student.toLowerCase());if(!s){alert('Student not found.');return}const status=prompt('Enter status: Present, Absent, Late or Leave','Present');if(!['Present','Absent','Late','Leave'].includes(status)){alert('Invalid status.');return}db.attendance.push({id:Date.now(),date,student:s.name,className:s.className,status});save();render()}
function sendChat(){const input=$('#chatText');if(!input||!input.value.trim())return;const q=input.value.trim();const box=$('#messages');box.innerHTML+=`<div class="bubble user">${esc(q)}</div>`;let answer='Please check the relevant section in the left menu. For official textbooks and syllabus, open Books & Learning Resources. This demo assistant is not connected to live school records or an AI service.';if(/book|syllabus|resource/i.test(q))answer='Open “Books & Learning Resources” in the sidebar. It contains links to official Delhi Education Department academic resources.';else if(/attendance/i.test(q))answer='Open “Attendance” to view demo attendance entries or mark a sample entry. Real attendance should be stored in a secure school database.';else if(/exam|result/i.test(q))answer='Open “Examinations & Results” to view sample examination schedules. A production version needs approved grading rules and secure marks entry.';else if(/notice/i.test(q))answer='Open “Notices & Events” to view the sample notices.';box.innerHTML+=`<div class="bubble">${answer}</div>`;input.value='';box.scrollTop=box.scrollHeight}
function saveSettings(){const v=$('#schoolNameInput').value.trim();if(!v){alert('Enter a school name.');return}localStorage.schoolName=v;$('#schoolBrand').textContent=v;alert('School display name saved in this browser.')}
function resetDemo(){if(!confirm('Reset all demo records in this browser?'))return;db=JSON.parse(JSON.stringify(seed));save();render()}
$('#schoolBrand').textContent=localStorage.schoolName||'Government School';
render();
</script>
</body>
</html>
